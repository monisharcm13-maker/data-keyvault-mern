
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Data KeyVault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h2 class="logo">Data KeyVault</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#features">Features</a>
        </nav>
    </header>

    <main id="home">
        <section class="hero">
            <h1>Manage Your Data Smarter</h1>
            <p>
                Store, organize, and manage
                your key-value data.
            </p>
            <a href="#features" class="btn">
                Explore Features
            </a>
        </section>

        <section id="features" class="features">
            <h2>Features</h2>
            <div class="feature-grid">
                <article class="feature-card">
                    <h3>Store</h3>
                    <p>Save key-value records.</p>
                </article>
                <article class="feature-card">
                    <h3>Search</h3>
                    <p>Find your saved records.</p>
                </article>
                <article class="feature-card">
                    <h3>Manage</h3>
                    <p>Edit and delete records.</p>
                </article>
            </div>
        </section>
    </main>
</body>
</html>

<section class="vault-section">
    <h2>My KeyVault Records</h2>

    <div class="input-group">
        <input
            type="text"
            id="keyInput"
            placeholder="Enter key"
        >

        <input
            type="text"
            id="valueInput"
            placeholder="Enter value"
        >

        <button id="addButton">
            Add Record
        </button>
    </div>

    <p id="message"></p>

    <div id="recordsContainer"></div>
</section>
